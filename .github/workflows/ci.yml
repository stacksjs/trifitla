name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  # Lets a deploy be re-run without an empty commit, e.g. after adding a secret.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@485c7b102fe14f8af00b57441a13dc3daa1505e7 # v0.10.39
        continue-on-error: true
        with:
          install: 'false'

      # The pantry action WARNS instead of failing when its bun download hits a
      # socket hang up, so a job sails past a broken setup and dies later with
      # `bun: command not found`. setup-bun guarantees a bun on PATH and is a
      # no-op when pantry already provided one.
      - name: Ensure Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Lint
        run: bun buddy lint

  typecheck:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@485c7b102fe14f8af00b57441a13dc3daa1505e7 # v0.10.39
        continue-on-error: true
        with:
          install: 'false'

      # The pantry action WARNS instead of failing when its bun download hits a
      # socket hang up, so a job sails past a broken setup and dies later with
      # `bun: command not found`. setup-bun guarantees a bun on PATH and is a
      # no-op when pantry already provided one.
      - name: Ensure Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install dependencies
        run: bun install

      - name: Set Application Key
        run: bun buddy key:generate

      - name: Typecheck
        run: bun buddy test:types

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@485c7b102fe14f8af00b57441a13dc3daa1505e7 # v0.10.39
        continue-on-error: true
        with:
          install: 'false'

      # The pantry action WARNS instead of failing when its bun download hits a
      # socket hang up, so a job sails past a broken setup and dies later with
      # `bun: command not found`. setup-bun guarantees a bun on PATH and is a
      # no-op when pantry already provided one.
      - name: Ensure Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Set Application Key
        run: bun buddy key:generate

      - name: Test Suite
        run: bun run test

  # Push-to-deploy for trifitla.stacksjs.com. Gated on the three checks above,
  # so a red CI silently means NO deploy rather than shipping a broken page.
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://trifitla.stacksjs.com
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@485c7b102fe14f8af00b57441a13dc3daa1505e7 # v0.10.39
        continue-on-error: true
        with:
          install: 'false'

      # The pantry action WARNS instead of failing when its bun download hits a
      # socket hang up, so the job used to sail on and die three steps later
      # with `bun: command not found`. It flaked on two of the first three
      # deploys. This guarantees a bun on PATH either way, and is a no-op when
      # pantry already provided one.
      - name: Ensure Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Prepare deploy SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "DEPLOY_SSH_KEY is not set — the deploy cannot reach the box." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          chmod 644 ~/.ssh/id_ed25519.pub

      - name: Deploy
        # buddy wraps ts-cloud: it resolves the production env, then attaches to
        # the stacks-owned box named by `cloud.attachTo` in config/cloud.ts.
        run: ./buddy deploy --prod --yes
        env:
          APP_ENV: production
          APP_URL: trifitla.stacksjs.com
          APP_DOMAIN: trifitla.stacksjs.com
          # This project is a TENANT on the shared stacks box, so the deploy
          # needs the Hetzner token to find it rather than provision one.
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          # trifitla.stacksjs.com lives in the stacksjs.com Route53 zone, not a
          # Porkbun one — this is what lets the deploy reconcile its records.
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          # .env.production is committed encrypted; this decrypts it, and the
          # APP_KEY inside it is what the running services are given.
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # tar on macOS runners writes ._ AppleDouble files into the release.
          COPYFILE_DISABLE: '1'

      - name: Verify the deployed site
        # A green deploy is not proof the box is serving, and the runner cannot
        # always resolve the public name. Ask the box over its own loopback.
        run: |
          code=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            root@178.105.248.188 \
            "curl -s -o /dev/null -w '%{http_code}' --resolve trifitla.stacksjs.com:443:127.0.0.1 https://trifitla.stacksjs.com/")
          echo "trifitla.stacksjs.com -> $code"
          [ "$code" = "200" ] || { echo "::error::trifitla.stacksjs.com returned $code"; exit 1; }
