dependencies:
  # Pinned exactly, so a new release never moves every checkout at once on the
  # next `pantry install`. bun.lock is `lockfileVersion: 2`, which only 1.4.x
  # reads, and the framework needs 1.4 to install: moving again is a deliberate
  # commit that bumps this pin and regenerates bun.lock together.
  bun: 1.4.4
  git: ^2.47.0
  sqlite: ^3.47.2
